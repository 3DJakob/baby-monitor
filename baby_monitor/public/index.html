<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baby Monitor</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell" id="modePicker">
      <section class="mode-picker" aria-label="Choose a mode">
        <button class="mode-button primary" id="streamButton" type="button">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
          </span>
          <span class="mode-copy">
            <strong>Stream</strong>
          </span>
        </button>

        <button class="mode-button" id="watchButton" type="button">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m10 8 6 4-6 4V8Z"></path>
              <rect width="20" height="14" x="2" y="5" rx="2"></rect>
            </svg>
          </span>
          <span class="mode-copy">
            <strong>Watch</strong>
          </span>
        </button>
      </section>
    </main>

    <section class="experience hidden" id="experience">
      <div class="video-stage">
        <article class="video-card hidden" id="localCard">
          <video id="localVideo" autoplay muted playsinline></video>
        </article>
        <article class="video-card hidden" id="remoteCard">
          <video id="remoteVideo" autoplay playsinline controls></video>
        </article>
      </div>
      <div class="floating-menu">
        <div class="floating-heading">
          <div class="status-pills">
            <span class="mode-pill" id="panelTitle">Baby Monitor</span>
            <span class="meta-pill" id="remotePill"><span class="live-dot" aria-hidden="true"></span><span class="live-label">Waiting</span></span>
          </div>
          <div class="heading-actions">
            <button class="camera-button hidden" id="switchCameraButton" type="button" aria-label="Switch camera" title="Switch camera">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 19V7a2 2 0 0 0-2-2h-3"></path>
                <path d="m14 2-2 3 2 3"></path>
                <path d="M4 5v12a2 2 0 0 0 2 2h3"></path>
                <path d="m10 22 2-3-2-3"></path>
              </svg>
            </button>
            <button class="close-button" id="closeButton" type="button" aria-label="Return to mode selection" title="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="status" id="status" aria-live="polite">Loading configuration…</p>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
  </html>
